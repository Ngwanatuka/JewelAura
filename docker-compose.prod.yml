version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    env_file:
      - .env.prod
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env.prod}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env.prod}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - internal

  backend:
    image: ngwanatuka/jewelaura-backend:1.1.0
    build: ./api
    expose:
      - "5000"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - MONGO_URL=${MONGO_URL:?Set MONGO_URL in .env.prod}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ngwanatuka/jewelaura-frontend:1.1.0
    build: ./front_end
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - internal

volumes:
  mongodb_data:
  uploads_data:

networks:
  internal:
    driver: bridge
